<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 516" width="100%">
  <style>
    :root {
      --bg: #FBFCFD; --panel: #FFFFFF; --note: #F3F5F8; --avatar: #EEF1F5; --line: #DCE2EA;
      --fg: #0B1220; --muted: #5A6678;
      --bad: #D93636; --bad-soft: #FDE8E8; --good: #3B7D0C; --good-soft: #EEF9DD;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0A0E16; --panel: #121A28; --note: #182133; --avatar: #1A2436; --line: #243049;
        --fg: #F4F7FB; --muted: #8C99AD;
        --bad: #FF5C5C; --bad-soft: #33161A; --good: #B4F04A; --good-soft: #1C2A12;
      }
    }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="1080" height="516" rx="18" fill="var(--bg)"/>
  <rect x="0.75" y="0.75" width="1078.5" height="514.5" rx="17.25" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <text x="540.0" y="50" text-anchor="middle" class="sans" font-size="26" font-weight="800" letter-spacing="-0.5" fill="var(--fg)">Share with your team. Leak nothing.</text>
  <text x="540.0" y="76" text-anchor="middle" class="sans" font-size="15" fill="var(--muted)">One note from bob, meant for alice and bob. Who can read it?</text>
  <g transform="translate(28 96)">
    <rect width="496" height="392" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <rect x="20" y="0" width="456" height="3" rx="1.5" fill="var(--bad)"/>
    <rect x="24" y="24" width="150.3" height="22" rx="11" fill="var(--bad-soft)"/>
    <text x="99.2" y="39" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="var(--bad)">TYPICAL SHARED RAG</text>
    <text x="24" y="78" class="sans" font-size="19" font-weight="750" fill="var(--fg)">Private notes leak into the team index</text>
    <rect x="24" y="96" width="448" height="44" rx="10" fill="var(--note)" stroke="var(--line)"/>
    <text x="40" y="123" class="mono" font-size="12.5" fill="var(--muted)">bob</text>
    <text x="76" y="123" class="sans" font-size="14" fill="var(--fg)">"DB freeze until Monday." Shared with alice and bob only.</text>
    <path d="M248 140 C 248 158, 98 152, 98 170" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="0"/>
    <circle cx="98" cy="192" r="22" fill="var(--avatar)" stroke="var(--good)" stroke-width="2.5"/>
    <text x="98" y="198" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="var(--fg)">A</text>
    <text x="98" y="236" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="var(--fg)">alice</text>
    <rect x="66.2" y="246" width="63.6" height="20" rx="10" fill="var(--good-soft)"/>
    <text x="98" y="260" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="var(--good)">SEES IT</text>
    <path d="M248 140 C 248 158, 248 152, 248 170" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="0"/>
    <circle cx="248" cy="192" r="22" fill="var(--avatar)" stroke="var(--good)" stroke-width="2.5"/>
    <text x="248" y="198" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="var(--fg)">B</text>
    <text x="248" y="236" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="var(--fg)">bob</text>
    <rect x="216.2" y="246" width="63.6" height="20" rx="10" fill="var(--good-soft)"/>
    <text x="248" y="260" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="var(--good)">SEES IT</text>
    <path d="M248 140 C 248 158, 398 152, 398 170" fill="none" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="0"/>
    <circle cx="398" cy="192" r="22" fill="var(--avatar)" stroke="var(--bad)" stroke-width="2.5"/>
    <text x="398" y="198" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="var(--fg)">C</text>
    <text x="398" y="236" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="var(--fg)">carol</text>
    <rect x="369.5" y="246" width="57.1" height="20" rx="10" fill="var(--bad-soft)"/>
    <text x="398" y="260" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="var(--bad)">LEAKED</text>
    <line x1="24" y1="286" x2="472" y2="286" stroke="var(--line)"/>
    <path d="M30 303 l7 7 M37 303 l-7 7" stroke="var(--bad)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="50" y="312" class="sans" font-size="14.5" fill="var(--fg)">Summaries inherit the widest access. Carol sees it.</text>
    <path d="M30 329 l7 7 M37 329 l-7 7" stroke="var(--bad)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="50" y="338" class="sans" font-size="14.5" fill="var(--fg)">Retracted rules linger until someone re-indexes.</text>
    <path d="M30 355 l7 7 M37 355 l-7 7" stroke="var(--bad)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="50" y="364" class="sans" font-size="14.5" fill="var(--fg)">Ex-teammates can still search old summaries.</text>
    </g>
  <g transform="translate(556 96)">
    <rect width="496" height="392" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <rect x="20" y="0" width="456" height="3" rx="1.5" fill="var(--good)"/>
    <rect x="24" y="24" width="86.2" height="22" rx="11" fill="var(--good-soft)"/>
    <text x="67.1" y="39" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="var(--good)">WITH KIPO</text>
    <text x="24" y="78" class="sans" font-size="19" font-weight="750" fill="var(--fg)">Everyone sees only what they should</text>
    <rect x="24" y="96" width="448" height="44" rx="10" fill="var(--note)" stroke="var(--line)"/>
    <text x="40" y="123" class="mono" font-size="12.5" fill="var(--muted)">bob</text>
    <text x="76" y="123" class="sans" font-size="14" fill="var(--fg)">"DB freeze until Monday." Shared with alice and bob only.</text>
    <path d="M248 140 C 248 158, 98 152, 98 170" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="0"/>
    <circle cx="98" cy="192" r="22" fill="var(--avatar)" stroke="var(--good)" stroke-width="2.5"/>
    <text x="98" y="198" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="var(--fg)">A</text>
    <text x="98" y="236" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="var(--fg)">alice</text>
    <rect x="66.2" y="246" width="63.6" height="20" rx="10" fill="var(--good-soft)"/>
    <text x="98" y="260" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="var(--good)">SEES IT</text>
    <path d="M248 140 C 248 158, 248 152, 248 170" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="0"/>
    <circle cx="248" cy="192" r="22" fill="var(--avatar)" stroke="var(--good)" stroke-width="2.5"/>
    <text x="248" y="198" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="var(--fg)">B</text>
    <text x="248" y="236" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="var(--fg)">bob</text>
    <rect x="216.2" y="246" width="63.6" height="20" rx="10" fill="var(--good-soft)"/>
    <text x="248" y="260" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="var(--good)">SEES IT</text>
    <path d="M248 140 C 248 158, 398 152, 398 170" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="398" cy="192" r="22" fill="var(--avatar)" stroke="var(--line)" stroke-width="2.5"/>
    <text x="398" y="198" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="var(--fg)">C</text>
    <text x="398" y="236" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="var(--fg)">carol</text>
    <rect x="366.2" y="246" width="63.6" height="20" rx="10" fill="var(--note)"/>
    <text x="398" y="260" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="var(--muted)">NOTHING</text>
    <line x1="24" y1="286" x2="472" y2="286" stroke="var(--line)"/>
    <path d="M29 307 l3.5 3.5 l6.5 -7" fill="none" stroke="var(--good)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="312" class="sans" font-size="14.5" fill="var(--fg)">Private notes stay in your local kp.sqlite.</text>
    <path d="M29 333 l3.5 3.5 l6.5 -7" fill="none" stroke="var(--good)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="338" class="sans" font-size="14.5" fill="var(--fg)">kp forget retracts it everywhere in 0 ms.</text>
    <path d="M29 359 l3.5 3.5 l6.5 -7" fill="none" stroke="var(--good)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="364" class="sans" font-size="14.5" fill="var(--fg)">Carol gets the same empty result as a missing note.</text>
    </g>
</svg>

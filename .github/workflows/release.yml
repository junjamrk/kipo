name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  KP_OFFLINE: "1"
  KP_DISABLE_MODEL_DOWNLOAD: "1"

jobs:
  preflight:
    name: Verify Tag & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag matches Cargo.toml version and OSS gates
        run: |
          set -euo pipefail
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          EXPECTED_VER="${RAW_TAG#v}"
          CARGO_VER="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$EXPECTED_VER" != "$CARGO_VER" ]; then
            echo "error: tag '${RAW_TAG}' does not match Cargo.toml version '${CARGO_VER}'" >&2
            exit 1
          fi
          sh -n scripts/install.sh
          python3 scripts/verify-oss-readiness.py

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace test suite
        run: cargo test --workspace --all-features --locked

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            archive_ext: tar.gz
            native_smoke: true
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            archive_ext: tar.gz
            native_smoke: false
          - target: x86_64-apple-darwin
            zig_target: ""
            os: macos-latest
            archive_ext: tar.gz
            native_smoke: false
          - target: aarch64-apple-darwin
            zig_target: ""
            os: macos-latest
            archive_ext: tar.gz
            native_smoke: true
          - target: x86_64-pc-windows-msvc
            zig_target: ""
            os: windows-latest
            archive_ext: zip
            native_smoke: true
          - target: aarch64-pc-windows-msvc
            zig_target: ""
            os: windows-latest
            archive_ext: zip
            native_smoke: false
    steps:
      - name: Checkout repository at release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig & cargo-zigbuild (glibc 2.28 compatibility on Linux)
        if: matrix.zig_target != ''
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zig_target != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build `kp` and `kp-connector` release binaries (Linux glibc 2.28)
        if: matrix.zig_target != ''
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.zig_target }} -p kipo --bin kp --features connectors
          cargo zigbuild --release --locked --target ${{ matrix.zig_target }} -p kp-connect --bin kp-connector

      - name: Build `kp` and `kp-connector` release binaries (macOS & Windows)
        if: matrix.zig_target == ''
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p kipo --bin kp --features connectors
          cargo build --release --locked --target ${{ matrix.target }} -p kp-connect --bin kp-connector

      - name: Package Unix `.tar.gz` archive
        id: pkg_unix
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          STAGE_NAME="kipo-${{ matrix.target }}"
          STAGE="dist/${STAGE_NAME}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/kp" "$STAGE/kp"
          cp "target/${{ matrix.target }}/release/kp-connector" "$STAGE/kp-connector"
          chmod 0755 "$STAGE/kp" "$STAGE/kp-connector"
          if [ "${{ matrix.native_smoke }}" = "true" ]; then
            "$STAGE/kp" --version
            "$STAGE/kp-connector" --version
          fi
          [ -f LICENSE ] && cp LICENSE "$STAGE/"
          [ -f README.md ] && cp README.md "$STAGE/"
          [ -f THIRD_PARTY_NOTICES.md ] && cp THIRD_PARTY_NOTICES.md "$STAGE/"
          mkdir -p artifacts
          ARCHIVE="artifacts/${STAGE_NAME}.tar.gz"
          tar -czf "$ARCHIVE" -C dist "${STAGE_NAME}"
          echo "archive_path=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Package Windows `.zip` archive
        id: pkg_win
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $StageName = "kipo-${{ matrix.target }}"
          $Stage = "dist/$StageName"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kp.exe" "$Stage/kp.exe"
          Copy-Item "target/${{ matrix.target }}/release/kp-connector.exe" "$Stage/kp-connector.exe"
          if ("${{ matrix.native_smoke }}" -eq "true") {
            & "$Stage/kp.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "kp.exe --version failed" }
            & "$Stage/kp-connector.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "kp-connector.exe --version failed" }
          }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$Stage/" }
          if (Test-Path "README.md") { Copy-Item "README.md" "$Stage/" }
          if (Test-Path "THIRD_PARTY_NOTICES.md") { Copy-Item "THIRD_PARTY_NOTICES.md" "$Stage/" }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $Archive = "artifacts/$StageName.zip"
          Compress-Archive -Path $Stage -DestinationPath $Archive -Force
          "archive_path=$Archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Attest build provenance (Sigstore SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pkg_unix.outputs.archive_path || steps.pkg_win.outputs.archive_path }}

      - name: Upload target archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Generate SHA256SUMS, Homebrew Formula & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all target archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS and Homebrew formula (`kipo.rb`)
        run: |
          set -euo pipefail
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VER="${RAW_TAG#v}"
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          chmod 0755 release-assets/install.sh
          cd release-assets
          sha256sum kipo-* install.sh install.ps1 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

          SHA_MAC_ARM="$(awk '$2=="kipo-aarch64-apple-darwin.tar.gz"{print $1}' SHA256SUMS)"
          SHA_MAC_X64="$(awk '$2=="kipo-x86_64-apple-darwin.tar.gz"{print $1}' SHA256SUMS)"
          SHA_LIN_ARM="$(awk '$2=="kipo-aarch64-unknown-linux-gnu.tar.gz"{print $1}' SHA256SUMS)"
          SHA_LIN_X64="$(awk '$2=="kipo-x86_64-unknown-linux-gnu.tar.gz"{print $1}' SHA256SUMS)"

          sed \
            -e "s/__VERSION__/${VER}/g" \
            -e "s/__SHA256_DARWIN_ARM64__/${SHA_MAC_ARM}/g" \
            -e "s/__SHA256_DARWIN_X86_64__/${SHA_MAC_X64}/g" \
            -e "s/__SHA256_LINUX_ARM64__/${SHA_LIN_ARM}/g" \
            -e "s/__SHA256_LINUX_X86_64__/${SHA_LIN_X64}/g" \
            ../packaging/homebrew/kipo.rb.tmpl > kipo.rb

      - name: Attest SHA256SUMS and installer provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Publish Release to junjamrk/kipo
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/kipo-*
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/kipo.rb
            release-assets/SHA256SUMS

      - name: Sync Homebrew tap formula (`junjamrk/homebrew-tap`) when token is configured
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap push."
            exit 0
          fi
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/junjamrk/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula
          cp release-assets/kipo.rb tap-repo/Formula/kipo.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kipo.rb
          if ! git diff --cached --quiet; then
            git commit -m "kipo ${RAW_TAG}"
            git push origin HEAD
          fi

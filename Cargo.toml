[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/junjamrk/kipo"
homepage = "https://github.com/junjamrk/kipo"
publish = false

[workspace.dependencies]
kp-model = { path = "crates/kp-model" }
kp-store = { path = "crates/kp-store", default-features = false }
kp-derive = { path = "crates/kp-derive" }
kp-retrieve = { path = "crates/kp-retrieve", default-features = false }
kp-net = { path = "crates/kp-net" }
kp-ingest = { path = "crates/kp-ingest" }
kp-connect = { path = "crates/kp-connect" }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
lopdf = { version = "0.38", default-features = false }
encoding_rs = "0.8"
chardetng = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.37", features = ["bundled"] }
jieba-rs = "0.7"
pulldown-cmark = "0.13"
htmd = "0.6"
regex = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
proptest = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
shlex = "2.0.1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
jiff = "0.2.46"
fastembed = { version = "7.8.0", default-features = false, features = ["ort-load-dynamic", "fancy-regex"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24", "load-dynamic"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
uninlined_format_args = "warn"

[workspace.lints.cargo]
unused_workspace_dependencies = "deny"
unused_dependencies = "deny"
redundant_homepage = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[package]
name = "kipo"
description = "Local-first personal and team memory database for AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
kp-ingest = { workspace = true, features = ["http-dream"] }
kp-connect = { workspace = true, optional = true }
kp-net.workspace = true
axum.workspace = true
kp-model.workspace = true
kp-store.workspace = true
kp-derive.workspace = true
kp-retrieve.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[features]
default = ["local-embed"]
local-embed = ["kp-store/local-embed", "kp-retrieve/local-embed"]
connectors = ["dep:kp-connect"]

[dev-dependencies]
kp-net = { workspace = true, features = ["test-inproc-uds"] }
reqwest.workspace = true
tempfile.workspace = true
lopdf.workspace = true
zip.workspace = true

[lints]
workspace = true

[[bin]]
name = "kp"
path = "src/main.rs"
